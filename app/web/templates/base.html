<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Парсер цін{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/products">Парсер цін</a>
    <nav>
      <a href="/products">Товари</a>
      <a href="/shops">Магазини</a>
      <a href="/docs" target="_blank" rel="noopener">API</a>
    </nav>
  </header>

  <main class="container">
    {% if msg %}<div class="flash">{{ msg }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    Локальна панель керування · дані оновлюються скриптом <code>run_parser.py</code>
  </footer>
</body>
</html>
